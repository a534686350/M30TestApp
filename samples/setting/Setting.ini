; M30TestApp.V2 station profile.
; Switch [DefaultLoadClass] entries between SIM (no hardware) and HW (real driver).
; Per-device sections supply the model name (must match Command.ini section) and address.

[DefaultLoadClass]
Pressure = "HW"
Oven     = "HW"
Dmm      = "HW"
Dac      = "HW"
Power    = "HW"
Board    = "HW"

[Device.Pressure]
Model    = "FLUKE-7250"
Address  = "GPIB1::10::INSTR"

[Device.Oven]
Model    = "GWSEBWT1670"
Address  = "COM5"
Baud     = "19200"
DataBits = "8"
Parity   = "None"
StopBits = "1"

[Device.Dmm]
Model    = "Keysight-34970A"
Address  = "GPIB1::9::INSTR"

[Device.Dac]
Model    = "M30-DAC"
Address  = "COM3"
Baud     = "9600"
DataBits = "8"
Parity   = "None"
StopBits = "1"

[Device.Power]
Model    = "ADCMT-6146"
Address  = "GPIB0::10::INSTR"

[Device.Board]
Model    = "Board"
Address  = "COM3"
Baud     = "9600"

[Slots]
; SIM 自动生成的工位数量，上限 256；若 工位对应表.csv 已有数据则忽略此项
Count        = "32"
SerialPrefix = "DEMO"

[App]
; 已废弃：早期版本用它在硬件失败时自动切 SIM。现在设备后端改为手动切换
; （配置 → 系统设置 → 行为 → 使用 SIM 模拟设备），此项保留仅为兼容旧配置，不再生效。
FallbackSimOnDisconnect = "0"
; 异常退出时保留断点，程序下次打开会询问是否按温度点续测。
SaveCheckpointOnAbort = "1"
; 默认不修改 Windows 更新策略，需现场明确勾选并以管理员权限运行。
BlockSystemUpdate = "0"
